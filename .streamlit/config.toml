# Innstillinger Streamlit leser automatisk når du skriver «streamlit run app.py»

[server]
# Hopper over e-postspørsmålet ved oppstart. Nettleseren åpnes ikke av seg selv,
# så gå til http://localhost:8501. (Ingen fast «address»: den hindrer publisering
# på Streamlit Community Cloud.)
headless = true
# Lar appen servere filene i static/ (skriften Inter) under adressen app/static/…
enableStaticServing = true

[browser]
# Ikke send bruksstatistikk til Streamlit
gatherUsageStats = false

[client]
# Skjuler «Deploy»-knappen og utviklermenyen øverst til høyre, så den som åpner
# lenken bare ser dashbordet
toolbarMode = "minimal"

# --- Tema: rolig, profesjonelt og nordisk ---------------------------------------
# Én hovedfarge (dyp petrol), rolig lys bakgrunn som hvite kort står mot (kortene og
# resten av utseendet settes i utseende.py). Statusfargene (grønn/oransje/rød)
# brukes bare til status. Fargene er kontrollert for kontrast og fargeblindhet.
[theme]
base = "light"
primaryColor = "#0F4C5C"
backgroundColor = "#F3F5F4"
secondaryBackgroundColor = "#EDF1F0"
textColor = "#1E2A30"
borderColor = "#DCE2E1"
linkColor = "#0F4C5C"
baseRadius = "0.625rem"
showSidebarBorder = true
# Inter: nøytral, lett å lese, tall som står pent under hverandre. Filene ligger i
# static/ (se [[theme.fontFaces]] under). Faller tilbake til sans-serif om de mangler.
font = "Inter, sans-serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]
# Grafer: samme rekkefølge overalt – petrol, lys petrol, nøytral grå
chartCategoricalColors = ["#0F4C5C", "#5F93A1", "#8A9499"]
# Infobokser i rolig petrol (brukes til merknader, ikke status)
blueColor = "#0F4C5C"
blueBackgroundColor = "#E4EEF0"
blueTextColor = "#0F4C5C"
# Statusfarger – mørkere tekstvariant for lesbarhet
greenColor = "#2E7D4F"
greenBackgroundColor = "#E3F0E7"
greenTextColor = "#1F5A37"
orangeColor = "#C98A12"
orangeBackgroundColor = "#FBF0D9"
orangeTextColor = "#7A5200"
redColor = "#A61B29"
redBackgroundColor = "#F8E1E3"
redTextColor = "#8A1622"
grayColor = "#5B6770"
grayBackgroundColor = "#E9EDEC"
grayTextColor = "#4A555C"

# Skriften Inter (SIL Open Font License, se static/inter-LICENSE.txt), selvhostet i
# static/, så den som åpner dashbordet ikke henter noe fra en ekstern tjeneste.
# Fire vekter: vanlig (400), medium (500), halvfet (600) og fet (700).
[[theme.fontFaces]]
family = "Inter"
url = "app/static/inter-latin-400-normal.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/inter-latin-500-normal.woff2"
weight = 500
style = "normal"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/inter-latin-600-normal.woff2"
weight = 600
style = "normal"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/inter-latin-700-normal.woff2"
weight = 700
style = "normal"

# Hvit sidemeny med tynn kant mot den lyse bakgrunnen
[theme.sidebar]
backgroundColor = "#FFFFFF"
