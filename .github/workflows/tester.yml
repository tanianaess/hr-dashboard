# Kjører alle testene automatisk på GitHub ved hver push og pull request.
# Resultatet vises som et merke («Tester») øverst i README.
name: Tester

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer pakkene
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Kjør testene
        run: pytest -q
